    <main>
        <h1>Hubungi YB Warkop</h1>
        <section>
            <p>Email: <a href="mailto:@YBwarkop.com">@YBwarkop.com</a></p>
            <p>WA: <a href="tel:+6281234567890">081234567890</a></p>
            <p>IG: <a href="https://www.instagram.com/kopibroyat/" target="_blank" rel="noopener">@YBwarkop</a></p>
           
        </section>
        <section>
            <h2>Booking Meja</h2>
            <form action="#" method="POST">
                <label for="nama">Nama</label><input type="text" id="nama" placeholder="Nama kamu" required>
                <label for="email">Email</label><input type="email" id="email" placeholder="@email kamu.com" required>
                <label for="telp">WA</label><input type="tel" id="telp" placeholder="08xxxxxx" required>
                <label for="tgl">Tanggal</label><input type="date" id="tgl" required>
                <label for="jml">Jumlah Orang</label><input type="number" id="jml" placeholder="2" min="1">
                <p>Area</p><label><input type="radio" name="area" required> Indoor</label><label><input type="radio"
                        name="area"> Outdoor</label>
                <label><input type="checkbox" required>Buka mulai pukul 16.00 WIB - 00.00WIB</label>
                <label for="paket">Keperluan</label><select id="paket" required>
                    <option value="">--Pilih--</option>
                    <option>Nongkrong</option>
                    <option>Tugas</option>
                    <option>Meeting</option>
                </select>
                <label for="pesan">Catatan</label><textarea id="pesan" placeholder="Indoor/Outdoor"></textarea>
                <button type="submit">Kirim</button><button type="reset">Reset</button>
            </form>
        </section>
        <section>
            <h2>Maps</h2>
           <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3952.0564715367736!2d110.29393627358094!3d-7.889161092133484!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e7aff3356fcb369%3A0xe95c2881d40adba1!2sKopi%20Puncak%20Rindu!5e0!3m2!1sen!2sid!4v1790749375168!5m2!1sen!2sid"
            width="600"  height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">

        </section>
